# Dynamic, encrypted gp3 EBS volumes through the AWS EBS CSI driver (EKS add-on aws-ebs-csi-driver).
# WaitForFirstConsumer creates the volume in the Availability Zone where the PostgreSQL pod is scheduled.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: coworking-gp3
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
parameters:
  type: gp3
  encrypted: "true"
