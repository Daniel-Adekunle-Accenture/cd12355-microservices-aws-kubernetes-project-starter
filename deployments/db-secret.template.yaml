# TEMPLATE ONLY: never commit a real value here.
# scripts/create-db-secret.sh fills in ${DB_PASSWORD} from a file kept outside the repository
# and pipes the result straight to kubectl, so the real value is never written under /workspace.
# Both the PostgreSQL Deployment and the coworking Deployment read the key DB_PASSWORD.
apiVersion: v1
kind: Secret
metadata:
  name: coworking-db-credentials
  namespace: coworking
type: Opaque
stringData:
  DB_PASSWORD: "${DB_PASSWORD}"
